name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout): the deploy
  # step can't always see an artifact uploaded earlier in the same job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only what the game loads. Raw uploads (Blender/FBX files, full-size
      # texture packs) stay in the repo but would push the site past the 1 GB limit.
      - name: Collect the game files
        run: |
          mkdir -p _site/assets/models/fox _site/assets/packs/stylized-nature _site/assets/textures
          cp -r index.html css js vendor _site/
          mkdir -p _site/assets/music
          find assets/music -maxdepth 1 -type f -exec cp {} _site/assets/music/ \;
          cp -r assets/music/bosses assets/music/final assets/music/main-menu _site/assets/music/
          cp -r assets/sfx _site/assets/
          cp -r assets/sprites _site/assets/
          cp -r assets/textures/raven-fantasy assets/textures/weapons assets/textures/glyphs assets/textures/ui _site/assets/textures/
          cp -r assets/packs/stylized-nature/web _site/assets/packs/stylized-nature/
          cp -r assets/models/game _site/assets/models/
          cp assets/models/fox/fox.glb _site/assets/models/fox/
          # cache busting: every deploy serves the code from a new folder (js-<commit>), so
          # a reload after an update never mixes old cached modules with new ones
          V=${GITHUB_SHA::8}
          mv _site/js _site/js-$V
          sed -i "s#src=\"js/main.js\"#src=\"js-$V/main.js\"#; s#href=\"css/style.css\"#href=\"css/style.css?v=$V\"#" _site/index.html
          grep -n "js-$V/main.js" _site/index.html
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
